# ── API Gateway — Render production profile ───────────────────────────────────
# Routes are defined in application.yml using ${AUTH_SERVICE_URL} / ${CONVERSION_SERVICE_URL}
# Those env vars are set in the Render Dashboard — direct HTTPS routing, no lb:// needed

spring.application.name=api-gateway
server.port=${PORT:8080}

# ── Eureka — gateway REGISTERS itself so it appears in dashboard ──────────────
# Routing still uses direct HTTPS URLs (not lb://) via env vars
eureka.client.enabled=true
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://eureka-server-u2c0.onrender.com/eureka}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.instance-id=api-gateway:${random.uuid}

# ── Disable service discovery locator (we use static routes only) ──────────────
spring.cloud.discovery.enabled=false

# ── CORS ─────────────────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=https://frontend-tql5.onrender.com,http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ── Actuator ─────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
