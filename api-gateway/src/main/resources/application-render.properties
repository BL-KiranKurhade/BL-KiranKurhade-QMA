# ── API Gateway — Render production profile (Properties Version) ──────────────────
server.port=${PORT:8080}
spring.application.name=api-gateway

# ── Gateway Routes ──────────────────────────────────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true

# Auth Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Conversion Routes
spring.cloud.gateway.routes[1].id=conversion-service
spring.cloud.gateway.routes[1].uri=lb://conversion-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/convert/**

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=https://frontend-tql5.onrender.com
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ── Eureka Registration ─────────────────────────────────────────────────────────
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://eureka-server-u2c0.onrender.com/eureka/}

eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.instance-id=api-gateway:${random.uuid}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.non-secure-port=80
eureka.instance.secure-port-enabled=false

# ── Actuator ────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
