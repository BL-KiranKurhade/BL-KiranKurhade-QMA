# ── API Gateway — Render production profile ───────────────────────────────────
spring.application.name=api-gateway
server.port=${PORT:8080}

# Disable auto-discovery locator (using explicit direct URL routes)
spring.cloud.gateway.discovery.locator.enabled=false

# ── Auth Routes ──────────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:https://qma-auth.onrender.com}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# ── Conversion Routes ────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[1].id=conversion-service
spring.cloud.gateway.routes[1].uri=${CONVERSION_SERVICE_URL:https://qma-conversion.onrender.com}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/convert/**

# ── Swagger API-Docs aggregation routes ─────────────────────────────────────────
spring.cloud.gateway.routes[2].id=auth-service-docs
spring.cloud.gateway.routes[2].uri=${AUTH_SERVICE_URL:https://qma-auth.onrender.com}
spring.cloud.gateway.routes[2].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/v3/api-docs/auth-service, /v3/api-docs

spring.cloud.gateway.routes[3].id=conversion-service-docs
spring.cloud.gateway.routes[3].uri=${CONVERSION_SERVICE_URL:https://qma-conversion.onrender.com}
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/conversion-service
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/v3/api-docs/conversion-service, /v3/api-docs

# ── Root redirect to Swagger UI ──────────────────────────────────────────────────
spring.cloud.gateway.routes[4].id=root-redirect
spring.cloud.gateway.routes[4].uri=no://op
spring.cloud.gateway.routes[4].predicates[0]=Path=/
spring.cloud.gateway.routes[4].filters[0]=RedirectTo=302, /swagger-ui.html

# ── CORS ─────────────────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=https://frontend-tql5.onrender.com,http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ── Eureka DISABLED — gateway uses direct URL routing ────────────────────────────
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# ── Actuator ─────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
