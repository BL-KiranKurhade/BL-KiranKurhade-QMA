server:
  port: ${PORT:8080}

spring:
  application:
    name: API-GATEWAY
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${ALLOWED_ORIGIN:https://frontend-tql5.onrender.com}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        # ── Business API routes ────────────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: conversion-service
          uri: lb://conversion-service
          predicates:
            - Path=/api/convert/**
          filters:
            - StripPrefix=0

        # ── Swagger API-Docs aggregation routes ───────────────────────────────
        # Each rewrites /v3/api-docs/<service> → /v3/api-docs on the target service
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        - id: conversion-service-docs
          uri: lb://conversion-service
          predicates:
            - Path=/v3/api-docs/conversion-service
          filters:
            - RewritePath=/v3/api-docs/conversion-service, /v3/api-docs

        # ── Redirect root to Swagger UI ──────────────────────────────────────────
        - id: root-redirect
          uri: no://op
          predicates:
            - Path=/
          filters:
            - RedirectTo=302, /swagger-ui.html

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:https://eureka-server-u2c0.onrender.com/eureka}
    fetch-registry: true
    register-with-eureka: true
    eureka-server-connect-timeout-seconds: 10
    eureka-server-read-timeout-seconds: 10
  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    instance-id: api-gateway:${random.uuid}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    non-secure-port: 80
    secure-port-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

# ── Springdoc / Swagger UI aggregated at the gateway ──────────────────────────
# Access: http://localhost:8080/swagger-ui.html
# Use the top-right dropdown to switch between services
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: conversion-service
        url: /v3/api-docs/conversion-service
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
