server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${ALLOWED_ORIGIN:https://frontend-tql5.onrender.com}"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        # ── Business API routes ────────────────────────────────────────────────
        # AUTH_SERVICE_URL env var → use direct HTTPS on Render
        # Falls back to lb://auth-service for local development
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:lb://auth-service}
          predicates:
            - Path=/api/auth/**

        - id: conversion-service
          uri: ${CONVERSION_SERVICE_URL:lb://conversion-service}
          predicates:
            - Path=/api/convert/**

        # ── Swagger API-Docs aggregation routes ───────────────────────────────
        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URL:lb://auth-service}
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        - id: conversion-service-docs
          uri: ${CONVERSION_SERVICE_URL:lb://conversion-service}
          predicates:
            - Path=/v3/api-docs/conversion-service
          filters:
            - RewritePath=/v3/api-docs/conversion-service, /v3/api-docs

        # ── Redirect root to Swagger UI ──────────────────────────────────────────
        - id: root-redirect
          uri: no://op
          predicates:
            - Path=/
          filters:
            - RedirectTo=302, /swagger-ui.html

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}
    instance-id: api-gateway:${random.uuid}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

# ── Springdoc / Swagger UI aggregated at the gateway ──────────────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: conversion-service
        url: /v3/api-docs/conversion-service
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
