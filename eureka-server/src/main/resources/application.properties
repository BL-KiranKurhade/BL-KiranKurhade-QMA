server.port=${SERVER_PORT:8761}
spring.application.name=eureka-server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=false
eureka.instance.hostname=eureka-server-u2c0.onrender.com
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://eureka-server-u2c0.onrender.com/eureka}
logging.level.com.netflix=WARN

# ── Actuator ────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
