# ── Conversion Service — Render production profile ───────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=render is set in Render environment vars.
# All sensitive values (DB_PASSWORD, JWT_SECRET) are injected via Render Dashboard.
spring.application.name=conversion-service

# ── Server ─────────────────────────────────────────────────────────────────────
# Render injects $PORT at runtime. Fallback is local dev port.
server.port=${PORT:8082}

# ── Database ────────────────────────────────────────────────────────────────────
# Full JDBC URL, username, and password injected from Render env vars
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-2cee1feb-qma-database.h.aivencloud.com:24566/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# ── JWT ─────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}

# ── Eureka Client ────────────────────────────────────────────────────────────────
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://eureka-server-u2c0.onrender.com/eureka}
eureka.client.eureka-server-connect-timeout-seconds=10
eureka.client.eureka-server-read-timeout-seconds=10
eureka.client.registry-fetch-interval-seconds=15
eureka.client.initial-instance-info-replication-interval-seconds=10

# ── Eureka Instance ──────────────────────────────────────────────────────────────
# Use the Render public hostname so Gateway can reach this service via LB routing
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
# Services on Render are exposed on port 443 (HTTPS) externally
eureka.instance.non-secure-port=443
eureka.instance.secure-port-enabled=false
eureka.instance.status-page-url=https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/info
eureka.instance.health-check-url=https://${RENDER_EXTERNAL_HOSTNAME:localhost}/actuator/health
eureka.instance.home-page-url=https://${RENDER_EXTERNAL_HOSTNAME:localhost}/

# ── Actuator ────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
