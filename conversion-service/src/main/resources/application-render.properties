# ── Conversion Service — Render production profile ───────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=render is set in Render environment vars.
# All sensitive values are injected via Render environment variables.

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8082}

# ── Database ────────────────────────────────────────────────────────────────────
# DB_PASSWORD must be set as a secret in the Render dashboard
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# ── JWT ─────────────────────────────────────────────────────────────────────────
# JWT_SECRET must be set as a secret in the Render dashboard (same value as auth-service)
app.jwt.secret=${JWT_SECRET}

# ── Enable Eureka ────────────────────────────────────────────────────────────────
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URI:https://eureka-server-u2c0.onrender.com/eureka/}
spring.cloud.discovery.enabled=true
spring.cloud.service-registry.auto-registration.enabled=true
