spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8082}
spring.application.name=conversion-service

# ── MySQL — Aiven Cloud ────────────────────────────────────────────────────────
# sslMode=REQUIRED (camelCase) is the correct MySQL Connector/J 8.x parameter.
# ssl-mode (hyphenated) is silently ignored and breaks SSL on Java 17+.
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT (same secret as auth-service) ─────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://eureka-server-u2c0.onrender.com/eureka/}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=*

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true
