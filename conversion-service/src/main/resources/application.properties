server.port=8082
spring.application.name=conversion-service

# ── MySQL ──────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://mysql-2cee1feb-qma-database.h.aivencloud.com:24566/defaultdb?ssl-mode=REQUIRED
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=avnadmin

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT (same secret as auth-service — used to extract username from token) ────
app.jwt.secret=QMAAuthServiceSecretKey2024ForJWTTokenSigningMustBe256BitsLong

# ── Eureka ─────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
measurement.service.url=http://measurement-service

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=*

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true
