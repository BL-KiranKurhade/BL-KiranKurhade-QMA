# ── Auth Service — Render production profile ──────────────────────────────────
# Activated when SPRING_PROFILES_ACTIVE=render is set in Render environment vars.
# All sensitive values are injected via Render environment variables.

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8083}

# ── Database ────────────────────────────────────────────────────────────────────
# DB_PASSWORD must be set as a secret in the Render dashboard
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# ── JWT ─────────────────────────────────────────────────────────────────────────
# JWT_SECRET must be set as a secret in the Render dashboard
app.jwt.secret=${JWT_SECRET}

# ── Disable Eureka (not used on Render — gateway uses direct URLs) ───────────────
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
