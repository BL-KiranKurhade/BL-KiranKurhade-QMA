# ============================================================
# QMA — Render Blueprint
#
# Architecture:
#   qma-eureka     → Eureka Server      (port 8761, registry)
#   qma-auth       → Auth Service       (port 8083)
#   qma-conversion → Conversion Service (port 8082)
#   qma-gateway    → API Gateway         (port 8080, public)
#   qma-frontend   → React + Nginx       (port 80,   public)
#
# Database: Aiven MySQL (already provisioned).
#
# ── Secrets to set manually in the Render dashboard ─────────
#   DB_PASSWORD  →  (Add this in Render Dashboard)
#   JWT_SECRET   →  QMAAuthServiceSecretKey2024ForJWTTokenSigningMustBe256BitsLong
#
# ── After first deploy ───────────────────────────────────────
#   1. Confirm actual .onrender.com URLs for each service.
#   2. Update AUTH_SERVICE_URL, CONVERSION_SERVICE_URL,
#      CORS_ALLOWED_ORIGINS, and API_GATEWAY_HOST if they
#      differ from the names below.
#   3. Redeploy gateway and frontend.
# ============================================================

services:

  # ── Eureka Server (Service Registry) ──────────────────────────
  - type: web
    name: qma-eureka
    runtime: docker
    dockerfilePath: ./eureka-server/Dockerfile
    dockerContext: ./eureka-server
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 8761
      - key: EUREKA_SERVER_URL
        value: https://eureka-server-u2c0.onrender.com/eureka

  # ── Auth Service ────────────────────────────────────────────
  - type: web
    name: qma-auth
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      # Aiven MySQL password — mark as secret in dashboard
      - key: DB_PASSWORD
        sync: false
      # JWT secret — must match conversion-service and gateway
      - key: JWT_SECRET
        sync: false
      - key: EUREKA_SERVER_URL
        value: https://eureka-server-u2c0.onrender.com/eureka

  # ── Conversion Service ──────────────────────────────────────
  - type: web
    name: qma-conversion
    runtime: docker
    dockerfilePath: ./conversion-service/Dockerfile
    dockerContext: ./conversion-service
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EUREKA_SERVER_URL
        value: https://eureka-server-u2c0.onrender.com/eureka

  # ── API Gateway ─────────────────────────────────────────────
  # Single public entry-point. Routes to auth + conversion via
  # direct HTTPS URLs (no Eureka required on Render).
  - type: web
    name: qma-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: EUREKA_SERVER_URL
        value: https://eureka-server-u2c0.onrender.com/eureka
      # CORS: set to your frontend's Render URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://eureka-server-u2c0.onrender.com,https://frontend-tql5.onrender.com

  # ── React Frontend ──────────────────────────────────────────
  # Built with nginx. start.sh injects the gateway URL at
  # container start-up (replaces the baked-in localhost placeholder).
  - type: web
    name: qma-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Just the hostname — start.sh prepends https://
      - key: API_GATEWAY_HOST
        value: bl-kirankurhade-qma-32wf.onrender.com
